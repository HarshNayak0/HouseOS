# Deploys the Supabase Edge Functions (supabase/functions/*) and their secrets.
# Runs when a function changes on main, or by hand (Actions → Deploy Supabase functions → Run workflow).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zdqiagmbyhfzofqauclj
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VAULT_MASTER_KEY: ${{ secrets.VAULT_MASTER_KEY }}
    steps:
      - name: Skip until the access token exists
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set yet — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - name: Set function secrets
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_SUBJECT" ]; then
            echo "::error::Add VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT as GitHub secrets"; exit 1
          fi
          args=(VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" VAPID_SUBJECT="$VAPID_SUBJECT" APP_URL="https://veeduos.vercel.app")
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ] && [ -n "$TOKEN_ENCRYPTION_KEY" ]; then
            args+=(GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" TOKEN_ENCRYPTION_KEY="$TOKEN_ENCRYPTION_KEY")
          else
            echo "::notice::Google Calendar secrets not set yet — the calendar function will say it isn't set up."
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            args+=(GEMINI_API_KEY="$GEMINI_API_KEY")
          else
            echo "::notice::GEMINI_API_KEY not set — caption imports use the simple rule-based reader."
          fi
          if [ -n "$VAULT_MASTER_KEY" ]; then
            args+=(VAULT_MASTER_KEY="$VAULT_MASTER_KEY")
          else
            echo "::notice::VAULT_MASTER_KEY not set — the closet vault will say it isn't set up."
          fi
          supabase secrets set --yes --project-ref "$PROJECT_REF" "${args[@]}"
      - name: Deploy functions
        if: steps.gate.outputs.run == 'true'
        # no gateway JWT check: notify takes no input; the others check the caller's session themselves
        run: |
          for fn in notify calendar recipes vault; do
            supabase functions deploy "$fn" --yes --project-ref "$PROJECT_REF" --no-verify-jwt
          done
      - name: Run once
        if: steps.gate.outputs.run == 'true'
        run: |
          curl --fail-with-body -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/notify" \
            -H "Content-Type: application/json" -d '{}'
          echo
          curl --fail-with-body -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/calendar/sync" \
            -H "Content-Type: application/json" -d '{}'
          echo
          # recipes and vault need a signed-in user, so an anonymous call must get a clean 4xx (it booted),
          # never a 5xx (it failed to start)
          for fn in recipes/import vault/status; do
            code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST "https://$PROJECT_REF.supabase.co/functions/v1/$fn" \
              -H "Content-Type: application/json" -H "Origin: https://veeduos.vercel.app" -d '{}')
            echo "$fn → $code $(head -c 200 /tmp/out.json)"
            if [ "$code" -ge 500 ]; then echo "::error::$fn failed to start"; exit 1; fi
          done
