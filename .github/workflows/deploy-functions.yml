# Deploys the Supabase Edge Functions (supabase/functions/*) and their secrets.
# Runs when a function changes on main, or by hand (Actions → Deploy Supabase functions → Run workflow).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zdqiagmbyhfzofqauclj
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - name: Skip until the access token exists
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set yet — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set function secrets
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_SUBJECT" ]; then
            echo "::error::Add VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT as GitHub secrets"; exit 1
          fi
          supabase secrets set --project-ref "$PROJECT_REF" \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" VAPID_SUBJECT="$VAPID_SUBJECT"
      - name: Deploy notify
        if: steps.gate.outputs.run == 'true'
        # no JWT check: the function takes no input and is safe to call any time
        run: supabase functions deploy notify --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Run it once
        if: steps.gate.outputs.run == 'true'
        run: |
          curl --fail-with-body -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/notify" \
            -H "Content-Type: application/json" -d '{}'
