# Free Supabase projects pause after 7 days without activity. This runs a tiny
# database query every 3 days so ours never pauses. Costs <1 Actions minute per run.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Skip until Supabase is set up
        if: env.SUPABASE_URL == '' || env.SUPABASE_ANON_KEY == ''
        run: echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY secrets not set yet — skipping."
      - name: Ping database
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
