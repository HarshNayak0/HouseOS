<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Veedu — 3D house prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito+Sans:wght@400;600;700&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF8F2;--plaster:#F6F1E7;--ink:#3B2418;--ink2:#7A6250;--teak:#7A4527;--red:#9C3B2A;--brass:#B8893B;--leaf:#4F7A3A;--lotus:#C98B8B;--urgent:#8A2B22}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#efe6d6;font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;touch-action:none}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));pointer-events:none;gap:8px;flex-wrap:wrap;z-index:5}
.brand{pointer-events:auto;background:var(--paper);border:1px solid var(--brass);border-radius:10px;padding:5px 12px 6px;box-shadow:0 2px 10px rgba(59,36,24,.12);display:flex;align-items:baseline;gap:8px}
.brand b{font-family:Fraunces,serif;font-size:20px;font-weight:600}
.brand span{font-family:Manjari,sans-serif;color:var(--ink2);font-size:15px}
.btns{display:flex;gap:8px;pointer-events:auto}
.btn{font:inherit;background:var(--paper);border:1px solid #d8c6a6;color:var(--ink);padding:8px 13px;border-radius:999px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 2px 8px rgba(59,36,24,.1)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn:active{transform:translateY(1px)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(251,248,242,.94);border:1px solid var(--brass);border-radius:999px;padding:4px 11px 3px;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;text-align:center;line-height:1.15;pointer-events:auto;transition:opacity .35s;box-shadow:0 2px 8px rgba(59,36,24,.15)}
.lbl small{display:block;font-family:Manjari,sans-serif;font-weight:400;color:var(--ink2);font-size:11px}
.lbl:hover{background:#fff6e2}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(59,36,24,.84);color:#fbf8f2;padding:8px 15px;border-radius:999px;font-size:13px;pointer-events:none;transition:opacity .4s;white-space:nowrap;z-index:4}
#panel{position:fixed;right:16px;top:74px;bottom:16px;width:370px;background:var(--paper);border:1px solid var(--brass);border-radius:10px;box-shadow:0 12px 40px rgba(59,36,24,.28);transform:translateX(430px);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;z-index:6}
#panel.open{transform:none}
.kasavu{height:11px;flex:none;background:linear-gradient(#FBF8F2 0 3px,transparent 3px),repeating-linear-gradient(90deg,#B8893B 0 7px,#E2C27A 7px 9px,#B8893B 9px 12px,#9a7230 12px 13px);border-bottom:2px solid #8a6424}
@media (max-width:720px){#panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:58vh;transform:translateY(112%)}#panel.open{transform:none}#hint{bottom:14px}}
.ph{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:flex-start;flex:none}
.ph h2{font-family:Fraunces,serif;margin:0;font-size:23px;font-weight:600;line-height:1.1}
.ph .ml{font-family:Manjari,sans-serif;color:var(--ink2);font-size:14px;margin-top:2px}
.ph .feat{font-size:12px;color:var(--teak);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.close{border:1px solid #e0d2b8;background:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink2);flex:none}
.pb{padding:2px 16px 18px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sec{margin-top:16px}
.sec h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #e6d9c2;font-size:14px}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .sub{font-size:12px;color:var(--ink2)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);flex:none}
.row.done .grow{text-decoration:line-through;color:#a8998a}
.who{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;flex:none}
.w-you{background:var(--teak)}.w-her{background:var(--lotus)}.w-both{background:var(--leaf)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid #e6d9c2}
.pill.u{border-color:#e7b2a8;background:#fdf0ec;color:var(--urgent)}
.pill.m{border-color:#e9d4a4;background:#fff8e6;color:#7d5a1a}
.card{border:1px solid #e6d9c2;border-radius:8px;padding:10px 12px;background:#fff;margin-bottom:8px}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#f3ead9;color:var(--teak);margin:2px 4px 0 0;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:#fff;border:1px solid #e6d9c2;border-radius:8px;text-align:center;padding:6px 2px;font-size:11px;color:var(--ink2)}
.day b{display:block;font-size:15px;color:var(--ink)}
.day.today{border-color:var(--red);background:#fdf3ef}
.dots{display:flex;justify-content:center;gap:3px;margin-top:4px;min-height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{padding:10px;border-radius:4px;font-size:13px;min-height:70px;box-shadow:0 2px 4px rgba(59,36,24,.12);position:relative}
.note .by{font-size:10.5px;color:rgba(59,36,24,.6);margin-top:6px;font-weight:700}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #dccdb2;border-radius:8px;background:#fff;min-width:0}
.addrow button{font:inherit;font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;border:none;background:var(--red);color:#fff;cursor:pointer}
.big{font-family:Fraunces,serif;font-size:28px;font-weight:600}
.muted{color:var(--ink2);font-size:12.5px}
.recipe{display:flex;gap:10px}
.recipe .img{width:64px;height:64px;border-radius:8px;flex:none;background:radial-gradient(circle at 40% 40%,#f3e2b0,#d9a74a 55%,#a5662a)}
.steps{font-size:12.5px;margin-top:6px}
.steps .s{padding:3px 0;color:#b4a693}.steps .s.on{color:var(--ink);font-weight:700}.steps .s.ok{color:var(--leaf)}
.idea{transition:transform .25s, box-shadow .25s}
.idea.pick{transform:scale(1.02);box-shadow:0 0 0 2px var(--brass),0 6px 18px rgba(184,137,59,.35)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:10px auto 0}
.pad button{font:inherit;font-size:19px;font-weight:700;padding:12px;border-radius:10px;border:1px solid #e0d2b8;background:#fff;cursor:pointer}
.pins{display:flex;justify-content:center;gap:10px;margin-top:6px}
.pins i{width:13px;height:13px;border-radius:50%;border:2px solid var(--brass);display:block}
.pins i.f{background:var(--brass)}
.secret{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.reveal{font:inherit;font-size:11.5px;font-weight:700;border:1px solid #e0d2b8;background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer}
.bar{height:7px;background:#efe4d1;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--leaf)}
.proto{font-size:11.5px;color:var(--ink2);margin-top:16px;font-style:italic;border-top:1px solid #eadfcb;padding-top:10px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe6d6;z-index:10;font-family:Fraunces,serif;font-size:20px;color:var(--teak);transition:opacity .6s}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<header>
  <div class="brand"><b>Veedu</b><span>വീട്</span></div>
  <div class="btns">
    <button class="btn primary" id="modeBtn">Step inside</button>
    <button class="btn" id="timeBtn">Evening</button>
  </div>
</header>
<div id="hint">Drag to look around · tap the house to step inside</div>
<aside id="panel" aria-live="polite"></aside>
<div id="loading">Building the tharavad…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const P = 0.45;      // plinth height (m)
const WH = 3.0;      // wall height (m)
const CUT = 0.4;     // wall scale in cutaway mode

/* ---------- renderer / scene ---------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI*0.47; controls.minDistance = 4; controls.maxDistance = 55;
controls.enablePan = false;

/* ---------- procedural textures ---------- */
let seed = 11;
const rnd = () => (seed = (seed*16807) % 2147483647, (seed-1)/2147483646);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, alpha){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
  return t;
}
function speckle(g, w, h, n, colors, rMax, a){
  for(let i=0;i<n;i++){ g.globalAlpha = a*(0.4+rnd()*0.6); g.fillStyle = colors[(rnd()*colors.length)|0];
    const r = 0.5 + rnd()*rMax; g.fillRect(rnd()*w, rnd()*h, r, r); }
  g.globalAlpha = 1;
}
function blotches(g, w, h, n, color, rMax, a){
  for(let i=0;i<n;i++){ const x=rnd()*w, y=rnd()*h, r=rMax*(0.3+rnd()*0.7);
    for(const dx of [-w,0,w]) for(const dy of [-h,0,h]){
      const gr = g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
      gr.addColorStop(0, color.replace('A', a)); gr.addColorStop(1, color.replace('A', 0));
      g.fillStyle = gr; g.fillRect(x+dx-r, y+dy-r, r*2, r*2); } }
}
const T = {};
T.plaster = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#efe8da'; g.fillRect(0,0,w,h);
  blotches(g,w,h,26,'rgba(190,170,140,A)',120,0.10); blotches(g,w,h,14,'rgba(255,255,250,A)',90,0.25);
  speckle(g,w,h,9000,['#d9ceb9','#fffaf0','#cfc2a8'],1.6,0.35); });
T.redOxide = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#8f3323'; g.fillRect(0,0,w,h);
  blotches(g,w,h,22,'rgba(60,14,8,A)',130,0.22); blotches(g,w,h,18,'rgba(200,90,60,A)',100,0.16);
  speckle(g,w,h,5000,['#6d2216','#a9473a','#7b2a1d'],1.4,0.4); });
T.border = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#2f1510'; g.fillRect(0,0,w,h); speckle(g,w,h,2500,['#4a2219','#21100b'],1.4,0.5); });
T.teak = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#74401f'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=2){ const shade = rnd(); g.strokeStyle = shade<0.5?'rgba(52,24,10,'+(0.12+rnd()*0.25)+')':'rgba(170,105,60,'+(0.08+rnd()*0.18)+')';
    g.lineWidth = 1+rnd()*1.6; g.beginPath(); const ph=rnd()*6, amp=1+rnd()*3;
    for(let x=0;x<=w;x+=16){ const yy = y + Math.sin(x/w*Math.PI*2*2+ph)*amp; x?g.lineTo(x,yy):g.moveTo(x,yy);} g.stroke(); }
  for(let i=0;i<4;i++){ const x=rnd()*w,y=rnd()*h; g.strokeStyle='rgba(40,18,8,.35)'; g.lineWidth=1.2;
    for(let r=3;r<22;r+=4){ g.beginPath(); g.ellipse(x,y,r*2.4,r*0.7,0,0,Math.PI*2); g.stroke(); } } });
T.roof = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#7d3a20'; g.fillRect(0,0,w,h);
  const rows=8, cols=8, tw=w/cols, th=h/rows;
  for(let r=0;r<rows;r++){ const off=(r%2)*tw/2;
    for(let c=-1;c<=cols;c++){ const x=c*tw+off, y=r*th;
      const v = rnd(); const col = ['#b65b35','#c26a41','#a9502e','#c9774c','#b4603a'][(v*5)|0];
      g.fillStyle = col; g.beginPath(); g.moveTo(x+2,y); g.lineTo(x+tw-2,y); g.lineTo(x+tw-2,y+th*0.92);
      g.quadraticCurveTo(x+tw/2,y+th*1.05,x+2,y+th*0.92); g.closePath(); g.fill();
      const gr = g.createLinearGradient(x,0,x+tw,0); gr.addColorStop(0,'rgba(60,20,8,.35)'); gr.addColorStop(.5,'rgba(255,210,170,.18)'); gr.addColorStop(1,'rgba(60,20,8,.35)');
      g.fillStyle = gr; g.fillRect(x+2,y,tw-4,th*0.92);
      g.fillStyle='rgba(40,12,4,.45)'; g.fillRect(x+2,y,tw-4,th*0.12); } }
  speckle(g,w,h,1800,['#3b3a2a','#5b5a3d','#2a1a10'],2.2,0.25);
  blotches(g,w,h,10,'rgba(40,45,30,A)',70,0.18); });
T.laterite = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#6f321a'; g.fillRect(0,0,w,h);
  const bw=w/3, bh=h/6;
  for(let r=0;r<6;r++){ const off=(r%2)*bw/2; for(let c=-1;c<=3;c++){ const x=c*bw+off+3, y=r*bh+3;
    g.fillStyle=['#a5552f','#9a4b28','#b0613a','#93462a'][(rnd()*4)|0]; g.fillRect(x,y,bw-6,bh-6); } }
  for(let i=0;i<2600;i++){ g.fillStyle='rgba(50,18,8,'+(0.3+rnd()*0.5)+')'; g.beginPath(); g.arc(rnd()*w,rnd()*h,0.8+rnd()*3.2,0,7); g.fill(); }
  speckle(g,w,h,3000,['#c7804f','#5a2410'],1.5,0.35); });
T.grass = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#5a7a34'; g.fillRect(0,0,w,h);
  blotches(g,w,h,20,'rgba(40,70,20,A)',120,0.3); blotches(g,w,h,14,'rgba(150,170,70,A)',90,0.2);
  for(let i=0;i<9000;i++){ const x=rnd()*w,y=rnd()*h; g.strokeStyle=['#4c6d2a','#6f9142','#86a650','#3f5f22'][(rnd()*4)|0];
    g.globalAlpha=0.5; g.lineWidth=1; g.beginPath(); g.moveTo(x,y); g.lineTo(x+(rnd()-0.5)*3,y-3-rnd()*5); g.stroke(); } g.globalAlpha=1; });
T.sand = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#d8c39c'; g.fillRect(0,0,w,h); blotches(g,w,h,20,'rgba(170,140,100,A)',110,0.15);
  speckle(g,w,h,12000,['#c4ab80','#eadbbd','#a58d66'],1.4,0.5);
  g.strokeStyle='rgba(150,120,85,.18)'; g.lineWidth=1.2; for(let i=0;i<40;i++){ const x=rnd()*w,y=rnd()*h; g.beginPath(); g.arc(x,y,40+rnd()*60,0.2,1.3); g.stroke(); } });
T.stone = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#a89c87'; g.fillRect(0,0,w,h);
  speckle(g,w,h,14000,['#7d7366','#d3c8b4','#5e554b','#c0b39b'],1.6,0.55);
  g.strokeStyle='rgba(60,50,40,.55)'; g.lineWidth=3; g.strokeRect(0,0,w/2,h/2); g.strokeRect(w/2,0,w/2,h/2); g.strokeRect(0,h/2,w/2,h/2); g.strokeRect(w/2,h/2,w/2,h/2); });
T.granite = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#2e2a28'; g.fillRect(0,0,w,h); speckle(g,w,h,5000,['#6e6560','#151312','#8a7f74'],1.5,0.6); });
T.lattice = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#24130a'; g.fillRect(0,0,w,h); g.strokeStyle='#8a5530'; g.lineWidth=11;
  for(let i=-w;i<=w*2;i+=64){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+h,h); g.stroke(); g.beginPath(); g.moveTo(i,h); g.lineTo(i+h,0); g.stroke(); }
  g.strokeStyle='rgba(30,12,4,.5)'; g.lineWidth=2; for(let i=-w;i<=w*2;i+=64){ g.beginPath(); g.moveTo(i+5,0); g.lineTo(i+5+h,h); g.stroke(); }
  g.strokeStyle='#6b3d1f'; g.lineWidth=14; g.strokeRect(0,0,w,h); });
T.fabric = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#efe3cb'; g.fillRect(0,0,w,h);
  const bands=[[20,14,'#a33a2a'],[38,4,'#b8893b'],[60,14,'#a33a2a'],[150,10,'#7a4527'],[168,4,'#b8893b'],[200,14,'#a33a2a']];
  for(const [y,hh,c] of bands){ g.fillStyle=c; g.fillRect(0,y,w,hh); }
  speckle(g,w,h,3000,['#ffffff','#c9b796'],1.2,0.3);
  g.globalAlpha=.08; g.fillStyle='#000'; for(let x=0;x<w;x+=3) g.fillRect(x,0,1,h); g.globalAlpha=1; });
T.water = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#2f6b73'; g.fillRect(0,0,w,h); blotches(g,w,h,16,'rgba(20,60,50,A)',140,0.35);
  g.strokeStyle='rgba(210,240,235,.22)'; g.lineWidth=1.5; for(let i=0;i<90;i++){ const x=rnd()*w,y=rnd()*h; g.beginPath(); g.ellipse(x,y,8+rnd()*26,2+rnd()*5,0,0,Math.PI); g.stroke(); } });
T.thatch = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#8f7238'; g.fillRect(0,0,w,h);
  for(let i=0;i<2500;i++){ const x=rnd()*w,y=rnd()*h; g.strokeStyle=['#c4a35c','#7a5c2a','#a88a48'][(rnd()*3)|0]; g.lineWidth=1.2; g.beginPath(); g.moveTo(x,y); g.lineTo(x+(rnd()-.5)*4,y+10+rnd()*10); g.stroke(); }
  g.fillStyle='rgba(60,40,15,.5)'; for(let y=0;y<h;y+=32) g.fillRect(0,y,w,3); });
T.trunk = canvasTex(128,256,(g,w,h)=>{ g.fillStyle='#7d6a52'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=10){ g.fillStyle='rgba(50,38,26,'+(0.3+rnd()*0.3)+')'; g.fillRect(0,y,w,2+rnd()*2); }
  speckle(g,w,h,1500,['#a8957a','#4d3e2e'],1.5,0.4); });
T.wicker = canvasTex(128,128,(g,w,h)=>{ g.fillStyle='#b38f55'; g.fillRect(0,0,w,h); g.strokeStyle='rgba(90,60,25,.6)'; g.lineWidth=2;
  for(let y=0;y<h;y+=8){ for(let x=0;x<w;x+=16){ g.beginPath(); g.moveTo(x,y+((x/16)%2?0:4)); g.lineTo(x+16,y+((x/16)%2?4:0)); g.stroke(); } } });

  if(!evening && noteGlow<=0.02 && !tweens.length) lamps[0].intensity = 0;
  ROOMS.backyard.lantern.scale.setScalar(1 + 0.15*Math.sin(t*3));
  ROOMS.backyard.boat.position.y = 0.16 + 0.025*Math.sin(t*1.3); ROOMS.backyard.boat.rotation.z = 0.02*Math.sin(t*1.1);
  const showL = mode==='inside';
  fridgeBadge.material.opacity = choreBadge.material.opacity = roof.visible ? 1 - roofMats[0].opacity : 1;
  for(const k in ROOMS){ const r = ROOMS[k]; proj.copy(r.lpos).project(camera);
    const vis = showL && proj.z < 1 && Math.abs(proj.x) < 1.1 && Math.abs(proj.y) < 1.1 && (!selected || selected===k);
    r.el.style.opacity = vis ? (selected ? 0 : 1) : 0; r.el.style.pointerEvents = vis && !selected ? 'auto' : 'none';
    r.el.style.left = ((proj.x+1)/2*innerWidth) + 'px'; r.el.style.top = ((1-proj.y)/2*innerHeight) + 'px'; }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
setTimeout(()=>{ const l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(()=>l.remove(), 700); }, 250);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', e => { if(e.key==='Escape' && selected) closePanel(); });
})();
</script>
</body>
